<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoMER Math Recognition</title>
    <!-- Load Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Load MathJax -->
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            },
            startup: {
                ready: () => {
                    MathJax.startup.defaultReady();
                    window.MathJaxReady = true;
                }
            }
        };
    </script>
    <style>
        .upload-container {
            border: 2px dashed #ccc;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
            border-radius: 5px;
            cursor: pointer;
        }
        .upload-container:hover {
            border-color: #0d6efd;
        }
        #file-input {
            display: none;
        }
        #preview-image {
            max-width: 100%;
            max-height: 300px;
            border: 1px solid #ddd;
            border-radius: 4px;
            display: none;
            margin: 0 auto;
        }
        .latex-display {
            overflow-x: auto;
            font-family: monospace;
            white-space: nowrap;
            padding: 10px;
            background-color: #f8f9fa;
            border-radius: 5px;
            margin-bottom: 10px;
        }
        .math-output {
            padding: 15px;
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 4px;
            overflow-x: auto;
            min-height: 60px;
        }
    </style>
</head>
<body>
    <div class="container my-5">
        <h1 class="text-center mb-4">CoMER Math Expression Recognition</h1>
        
        <div class="row">
            <div class="col-lg-8 mx-auto">
                <!-- Image Upload -->
                <div class="card mb-4">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">Upload Image</h5>
                    </div>
                    <div class="card-body">
                        <div class="upload-container" id="upload-area">
                            <p class="mb-2">Click or drag an image containing a mathematical expression</p>
                            <p class="text-muted small">Supported formats: JPG, PNG, BMP</p>
                            <input type="file" id="file-input" accept=".jpg, .jpeg, .png, .bmp">
                            <button class="btn btn-primary" id="upload-button">Select Image</button>
                        </div>
                        
                        <div class="text-center mt-3">
                            <img id="preview-image" class="img-fluid" alt="Image preview">
                        </div>
                        
                        <div class="mt-3 text-center">
                            <button id="process-button" class="btn btn-success btn-lg" disabled>
                                Process Image
                            </button>
                        </div>
                    </div>
                </div>
                
                <!-- Results Section -->
                <div id="results-container" style="display: none;">
                    <div class="card mb-4">
                        <div class="card-header bg-primary text-white">
                            <h5 class="mb-0">Recognition Results</h5>
                        </div>
                        <div class="card-body">
                            <h5>LaTeX:</h5>
                            <div id="latex-display" class="latex-display"></div>
                            
                            <h5>Rendered Expression:</h5>
                            <div id="math-output" class="math-output"></div>
                        </div>
                    </div>
                </div>
                
                <!-- Loading Spinner -->
                <div id="loading" class="text-center my-4" style="display: none;">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <p class="mt-2">Processing image with CoMER...</p>
                </div>
            </div>
        </div>
    </div>
    
    <!-- JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Elements
            const uploadArea = document.getElementById('upload-area');
            const fileInput = document.getElementById('file-input');
            const uploadButton = document.getElementById('upload-button');
            const previewImage = document.getElementById('preview-image');
            const processButton = document.getElementById('process-button');
            const resultsContainer = document.getElementById('results-container');
            const latexDisplay = document.getElementById('latex-display');
            const mathOutput = document.getElementById('math-output');
            const loading = document.getElementById('loading');
            
            // File upload logic
            uploadArea.addEventListener('click', function() {
                fileInput.click();
            });
            
            uploadButton.addEventListener('click', function(e) {
                e.stopPropagation();
                fileInput.click();
            });
            
            // Drag and drop
            uploadArea.addEventListener('dragover', function(e) {
                e.preventDefault();
                uploadArea.style.borderColor = '#0d6efd';
            });
            
            uploadArea.addEventListener('dragleave', function() {
                uploadArea.style.borderColor = '#ccc';
            });
            
            uploadArea.addEventListener('drop', function(e) {
                e.preventDefault();
                uploadArea.style.borderColor = '#ccc';
                
                if (e.dataTransfer.files.length) {
                    fileInput.files = e.dataTransfer.files;
                    handleFileSelect();
                }
            });
            
            // File selection handler
            fileInput.addEventListener('change', handleFileSelect);
            
            function handleFileSelect() {
                const file = fileInput.files[0];
                if (!file) return;
                
                // Show image preview
                const reader = new FileReader();
                reader.onload = function(e) {
                    previewImage.src = e.target.result;
                    previewImage.style.display = 'block';
                    processButton.disabled = false;
                };
                reader.readAsDataURL(file);
            }
            
            // Process image
            processButton.addEventListener('click', function() {
                const file = fileInput.files[0];
                if (!file) return;
                
                // Prepare form data
                const formData = new FormData();
                formData.append('file', file);
                
                // Show loading, hide results
                loading.style.display = 'block';
                resultsContainer.style.display = 'none';
                
                // Send request
                fetch('/upload', {
                    method: 'POST',
                    body: formData
                })
                .then(response => response.json())
                .then(data => {
                    loading.style.display = 'none';
                    resultsContainer.style.display = 'block';
                    
                    if (data.error) {
                        showError(data.error);
                        return;
                    }
                    
                    // Display results
                    latexDisplay.textContent = data.latex;
                    mathOutput.innerHTML = '$$' + data.latex + '$$';
                    
                    // Render math - using MathJax's proper typesetting method
                    if (window.MathJax) {
                        MathJax.typeset ? MathJax.typeset([mathOutput]) : 
                                        (MathJax.Hub ? MathJax.Hub.Queue(["Typeset", MathJax.Hub, mathOutput]) : null);
                    }
                })
                .catch(error => {
                    loading.style.display = 'none';
                    showError('Network error: ' + error.message);
                });
            });
            
            function showError(message) {
                resultsContainer.style.display = 'block';
                latexDisplay.textContent = 'Error: ' + message;
                mathOutput.textContent = 'Unable to render';
            }
        });
    </script>
</body>
</html>
