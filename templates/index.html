<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwinCoMER — Nhận dạng công thức toán viết tay</title>

    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] },
            svg: { fontCache: 'global' },
            startup: { typeset: false }
        };
    </script>
    <script id="MathJax-script" async
            src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        :root {
            --bg: #f6f4ef; --panel: #fff; --fg: #24211c; --fg2: #6b655c;
            --line: #ddd7cc; --accent: #7f8f68; --danger: #b8654f;
            --radius: 12px;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1b1a18; --panel: #24221f; --fg: #e8e4dc; --fg2: #a8a196;
                --line: #3a3733; --accent: #8f9a7e;
            }
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 32px 16px 64px; background: var(--bg); color: var(--fg);
            font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .wrap { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
        h1 { margin: 0; font-size: 26px; font-weight: 600; }
        .sub { margin: 0; color: var(--fg2); font-size: 14px; }

        .notice, .error {
            margin: 0; padding: 10px 14px; border-radius: 10px; font-size: 13.5px;
            border-left: 3px solid var(--accent);
            background: color-mix(in srgb, var(--accent) 12%, transparent);
        }
        .error { border-left-color: var(--danger);
                 background: color-mix(in srgb, var(--danger) 12%, transparent); }
        [hidden] { display: none !important; }

        .drop {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 6px; min-height: 190px; padding: 24px; text-align: center; cursor: pointer;
            border: 2px dashed var(--line); border-radius: 14px; background: var(--panel);
            transition: border-color .15s, background .15s;
        }
        .drop:hover, .drop:focus-visible, .drop.drag { border-color: var(--accent); }
        .drop strong { font-weight: 500; }
        .drop small { color: var(--fg2); }

        .spinner {
            width: 16px; height: 16px; border-radius: 50%; display: inline-block;
            border: 2px solid var(--line); border-top-color: var(--accent);
            animation: spin .7s linear infinite; vertical-align: -3px; margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .result { display: grid; grid-template-columns: minmax(0,250px) minmax(0,1fr); gap: 16px; align-items: start; }
        .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; min-width: 0; }
        .panel h2 { margin: 0 0 12px; font-size: 11.5px; font-weight: 600; letter-spacing: .05em;
                    text-transform: uppercase; color: var(--fg2); }
        .thumb { width: 100%; border-radius: 8px; background: #fff; }

        /* MathJax sizes itself to the expression; a long one scrolls inside
           the panel instead of widening the grid column. */
        .render { overflow-x: auto; overflow-y: hidden; padding: 6px 2px 12px; }
        .empty { margin: 0; color: var(--fg2); font-size: 14px; }

        code.latex {
            display: block; padding: 10px 12px; border-radius: 8px; margin-bottom: 10px;
            background: var(--bg); color: var(--fg2); white-space: pre-wrap; word-break: break-word;
            font: 12.5px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
        }
        button {
            padding: 6px 12px; border: 1px solid var(--line); border-radius: 8px;
            background: transparent; color: var(--fg2); font-size: 13px; cursor: pointer;
        }
        button:hover { border-color: var(--accent); color: var(--fg); }

        dl.meta { display: flex; flex-wrap: wrap; gap: 18px; margin: 14px 0 0;
                  padding-top: 12px; border-top: 1px solid var(--line); }
        dl.meta dt { font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--fg2); }
        dl.meta dd { margin: 2px 0 0; font-size: 14px; }

        label.cpu { display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--fg2); }

        @media (max-width: 720px) { .result { grid-template-columns: minmax(0,1fr); } }
    </style>
</head>
<body>
<div class="wrap">
    <header>
        <h1>Nhận dạng công thức toán viết tay</h1>
        <p class="sub">
            SwinCoMER — tải lên ảnh <strong>một biểu thức</strong>, nhận lại LaTeX.
            Ảnh chụp cả trang nhiều dòng sẽ cho kết quả sai; hãy cắt từng biểu thức.
        </p>
    </header>

    <p class="notice" id="status" hidden></p>

    <div class="drop" id="drop" role="button" tabindex="0" aria-label="Chọn ảnh công thức">
        <input type="file" id="file" accept="image/png,image/jpeg,image/bmp" hidden>
        <span id="dropIdle">
            <strong>Kéo thả ảnh công thức vào đây</strong><br>
            <small>hoặc bấm để chọn — PNG, JPG, BMP</small>
        </span>
        <span id="dropBusy" hidden><span class="spinner"></span>Đang nhận dạng…</span>
    </div>

    <label class="cpu">
        <input type="checkbox" id="useCpu">
        Dùng CPU thay vì GPU (chậm hơn nhưng chắc chắn hơn)
    </label>

    <p class="error" id="error" role="alert" hidden></p>

    <section class="result" id="result" hidden>
        <div class="panel">
            <h2>Ảnh đã nhận</h2>
            <img class="thumb" id="thumb" alt="Ảnh công thức đã tải lên">
        </div>
        <div class="panel">
            <h2>Công thức</h2>
            <div class="render" id="render"></div>
            <div id="latexBox" hidden>
                <code class="latex" id="latex"></code>
                <button id="copy">Chép LaTeX</button>
            </div>
            <dl class="meta">
                <div><dt>Thời gian</dt><dd id="mTime">—</dd></div>
                <div><dt>Thiết bị</dt><dd id="mDevice">—</dd></div>
                <!-- Beam-search log-probability. Not calibrated, so it ranks
                     one result against another rather than meaning anything on
                     its own — labelled "điểm", never shown as a percentage. -->
                <div><dt>Điểm</dt><dd id="mScore">—</dd></div>
            </dl>
        </div>
    </section>
</div>

<script>
const $ = id => document.getElementById(id);
const drop = $("drop"), fileInput = $("file");

// Asked on load so a missing checkpoint is visible before the user picks a
// file, instead of being discovered by a failed upload.
fetch("/status").then(r => r.json()).then(showStatus).catch(() => {});

function showStatus(s) {
    let msg = "";
    if (!s.import_ok)            msg = `Chưa import được package 'comer' (${s.import_error}). Chạy: pip install -e ./SwinCoMER`;
    else if (!s.checkpoint_exists) msg = `Không tìm thấy checkpoint tại "${s.checkpoint}".`;
    else if (s.last_error)       msg = s.last_error;
    // Measured, not guessed: ~107s per image on CPU at beam_size 2 with the
    // bundled CROHME sample. Saying "a few seconds" here would have people
    // reloading the page thinking it had hung.
    else if (!s.cuda_available)  msg = `Không thấy GPU — chạy trên CPU, mỗi ảnh mất khoảng 1,5–2 phút (beam_size=${s.beam_size}). Hãy kiên nhẫn chờ.`;
    if (msg) { $("status").textContent = msg; $("status").hidden = false; }
    else $("status").hidden = true;
}

drop.addEventListener("click", () => fileInput.click());
drop.addEventListener("keydown", e => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); fileInput.click(); }
});
drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("drag"); });
drop.addEventListener("dragleave", () => drop.classList.remove("drag"));
drop.addEventListener("drop", e => {
    e.preventDefault(); drop.classList.remove("drag");
    if (e.dataTransfer.files[0]) send(e.dataTransfer.files[0]);
});
fileInput.addEventListener("change", e => {
    if (e.target.files[0]) send(e.target.files[0]);
    e.target.value = "";   // so picking the same file twice still fires
});

function busy(on) {
    $("dropIdle").hidden = on;
    $("dropBusy").hidden = !on;
    drop.style.cursor = on ? "progress" : "pointer";
}

async function send(file) {
    busy(true);
    $("error").hidden = true;
    $("result").hidden = true;

    const form = new FormData();
    form.append("file", file);
    form.append("use_cpu", $("useCpu").checked);

    try {
        const res = await fetch("/upload", { method: "POST", body: form });
        const data = await res.json();
        // The server puts an actionable reason in `error` for 400/503/507.
        // Showing the status code instead would throw that away.
        if (!res.ok) throw new Error(data.error || `Lỗi ${res.status}`);
        render(file, data);
    } catch (err) {
        $("error").textContent = err.message;
        $("error").hidden = false;
    } finally {
        busy(false);
        fetch("/status").then(r => r.json()).then(showStatus).catch(() => {});
    }
}

function render(file, data) {
    $("thumb").src = URL.createObjectURL(file);
    $("mTime").textContent = data.elapsed_ms + " ms";
    $("mDevice").textContent = data.device;
    $("mScore").textContent = data.score.toFixed(3);

    const latex = (data.latex || "").trim();
    $("latexBox").hidden = !latex;

    if (!latex) {
        // An empty beam is a real outcome, not an error: the model ran and
        // had nothing to say about this image.
        $("render").innerHTML = '<p class="empty">Mô hình chạy xong nhưng không đưa ra giả thuyết nào cho ảnh này.</p>';
    } else {
        $("latex").textContent = latex;
        $("render").textContent = "$$" + latex + "$$";
        if (window.MathJax?.typesetPromise) {
            // A partially-recognized expression is often invalid LaTeX (an
            // unclosed brace, a stray ^). Say so rather than leaving the raw
            // markup on screen looking like a rendering that never happened.
            MathJax.typesetPromise([$("render")]).catch(() => {
                $("render").innerHTML = '<p class="empty">Không dựng được công thức từ chuỗi LaTeX này.</p>';
            });
        }
    }
    $("result").hidden = false;
}

$("copy").addEventListener("click", async () => {
    try {
        await navigator.clipboard.writeText($("latex").textContent);
        $("copy").textContent = "Đã chép";
        setTimeout(() => ($("copy").textContent = "Chép LaTeX"), 1500);
    } catch {
        // Clipboard is permission-gated. The LaTeX is on screen and
        // selectable, so a failed copy is not worth an error state.
    }
});
</script>
</body>
</html>
